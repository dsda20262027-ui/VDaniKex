name: Build VDaniKex installers

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "src/**"
      - "include/**"
      - "installer/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-installer.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} installer
    runs-on: windows-2019
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: cmake --build build --config Release --parallel

      - name: Run host diagnostic smoke test
        shell: pwsh
        run: |
          & ".\build\Release\vdk-probe.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "vdk-probe failed with exit code $LASTEXITCODE"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "/DAppArch=${{ matrix.arch }}" "/DSourceDir=build\Release" "/Odist" "installer\VDaniKex.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }
          Get-ChildItem dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDaniKex-Setup-${{ matrix.arch }}
          path: dist/VDaniKex-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 14
